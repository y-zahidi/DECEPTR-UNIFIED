name: ✨ Feature Request
description: Suggest a new feature or improvement for DECEPTR-UNIFIED
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature!
        Please describe what you'd like and why.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: Is your feature request related to a problem? Describe it.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the solution you'd like.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component would this affect?
      options:
        - Deception (honeypots, pipeline)
        - DFIR (Velociraptor, reports)
        - OpenCTI (connectors, correlation)
        - Attack simulation (CALDERA, Atomic)
        - Bridge API
        - Dashboard
        - Docker / infrastructure
        - New component
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions or features you've considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context, screenshots, or references.
